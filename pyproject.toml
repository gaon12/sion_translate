[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sion-translate"
version = "0.1.0"
description = "From-scratch Korean-Japanese experimental machine translation training stack"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2.0",
  "PyYAML>=6.0",
  "sacrebleu>=2.5",
  # 0.2.2 drops the normalization offset buffer used by the trainer and
  # deterministically SIGSEGVs on the production corpus with multiple threads.
  "sentencepiece==0.2.1",
  "safetensors>=0.5",
  "tensorboard>=2.18",
  "torch>=2.8",
  "tqdm>=4.66",
  "transformers>=5.0,<6",
]

[project.optional-dependencies]
# ruff is pinned to a minor range on purpose. Its formatter changes between
# minor versions, so an open bound lets CI reformat code the maintainer never
# touched and fail `ruff format --check` with no commit to blame.
dev = ["pyright>=1.1.411,<1.2", "pytest>=8.3", "ruff>=0.15,<0.16"]
baselines = []
export = ["gguf>=0.19", "torchao>=0.17"]
# Korean-specific helper used only by scripts/data/build_hanboneo.py for josa
# selection. The builder falls back to a built-in implementation when it is
# absent, so this is genuinely optional and the core stack stays
# language-agnostic.
hangul = ["hangulpy>=1.4"]

[project.urls]
Repository = "https://github.com/gaon12/sion_translate"
Model = "https://huggingface.co/gaon12/sion_translate"

[project.scripts]
sion-audit-data = "sion_translate.cli.audit_data:main"
sion-audit-tokens = "sion_translate.cli.audit_tokens:main"
sion-train-tokenizer = "sion_translate.cli.train_tokenizer:main"
sion-prepare-data = "sion_translate.cli.prepare_data:main"
sion-train = "sion_translate.cli.train:main"
sion-translate = "sion_translate.cli.translate:main"
sion-augment = "sion_translate.cli.augment:main"
sion-evaluate = "sion_translate.cli.evaluate:main"
sion-check-preservation = "sion_translate.cli.check_preservation:main"
sion-prepare-benchmark = "sion_translate.cli.prepare_benchmark:main"
sion-compare = "sion_translate.cli.compare:main"
sion-concat = "sion_translate.cli.concat:main"
sion-revise-data = "sion_translate.cli.revise_data:main"
sion-translate-cases = "sion_translate.cli.translate_cases:main"
sion-translate-queue = "sion_translate.cli.translate_queue:main"
sion-export = "sion_translate.cli.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "PLE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
