# ============================================================================
# sion_translate 1.5 production configuration
#
# `sion-train` loads this file automatically when no --config path is given.
# Default launch uses the measured single A100/H100 80GB profile and caps MRT
# at 100,000 optimizer updates. See docs/gpu-training-audit-2026-09-03.md.
# Unspecified values still follow the automatic policy. Re-measure after
# changing the corpus, vocabulary, model, sequence lengths, or objectives.
#
# Automatic policy covers:
#   - smooth token-scaled capacity from a dense valid architecture ladder;
#   - BF16, FP16, or FP32 precision from the common device capability;
#   - per-GPU batch size, activation checkpointing, and accumulation;
#   - complete-corpus epoch budget and epoch-boundary early stopping;
#   - warmup, evaluation, save, and validation budgets;
#   - DataLoader workers and single, DDP, or FSDP2 execution.
#
# torch.compile is never guessed. Enable training.compile only after validating
# the exact accelerator, container, and PyTorch stack.
#
# Data discovery:
#   - immediate data/*.jsonl files are scanned automatically;
#   - a changed source inventory invalidates incompatible indexed artifacts;
#   - a missing tokenizer is trained from the configured language graph;
#   - a complete compatible latest checkpoint resumes automatically.
# ============================================================================

model:
  experimental:
    # Keep experimental architecture changes isolated. Only full-distribution
    # candidate refinement changes runtime behavior in this production run.

    # Kimi K3 SiTU-GLU softly limits FFN pre-activations. Although parameter
    # shapes remain compatible, the activation and optimization path changes,
    # so validate it in a separate ablation.
    situglu_enabled: false

    # BATS needs supervised alignment labels. The built-in collator does not
    # provide them, and a coverage-only objective can be minimized by uniform
    # attention, so it is not treated as a useful signal here.
    bats_enabled: false
    bats_coverage_weight: 0.0

    # CoRe predicts target register as an auxiliary objective. Class 0 means
    # that no heuristic matched and is excluded from supervision. Keep this
    # disabled until a controlled register-quality ablation justifies it.
    core_enabled: false
    register_loss_weight: 0.05

    # MorphoScript is disabled because tokenizer token_features.npz already
    # carries script features and the reviewed current shards showed no script
    # preservation failures. Enable it only for a measured failure.
    morphoscript_enabled: false

    # Typed entity memory is another independent architecture intervention.
    # Keep it disabled while candidate refinement is the selected ablation.
    tetm_enabled: false

    # Evidence repair rereads encoder states after the decoder stack. It does
    # not yet implement a complete closed loop that selectively re-encodes
    # source spans, so it remains disabled in this run.
    evidence_repair_enabled: false

    # Feed the exact first full-vocabulary distribution back as its expected
    # token embedding, then predict unrestricted vocabulary logits again. This
    # is differentiable distribution refinement, not top-k reranking. Chunking
    # bounds peak temporary memory without approximating the probability mass.
    # Draft CE weight 0.25 trains both the preliminary and final distributions.
    candidate_refinement_enabled: true
    candidate_refinement_steps: 1
    candidate_refinement_temperature: 1.0
    candidate_refinement_loss_weight: 0.25
    candidate_refinement_vocab_chunk_size: 2048

    # Semantic parity aligns pooled source and teacher-forced target states. It
    # is not an independently encoded generated-output checksum, so it remains
    # disabled until a separate ablation.
    semantic_parity_enabled: false

  # Measured architecture: 273,484,225 parameters with this vocabulary.
  vocab_size: 48000
  d_model: 832
  encoder_layers: 18
  decoder_layers: 9
  num_heads: 8
  num_kv_heads: 4
  d_ff: 2304
  gradient_checkpointing: false

data:
  # Adding or changing an immediate JSONL file updates the authenticated source
  # inventory. Nested excluded/evaluation directories are not training input.
  raw_dir: data

  # These three artifacts form one compatibility unit. Reuse validates the
  # digit policy, language controls, tokenizer digest, token features, indexed
  # schema, exact graph, and raw-source fingerprint.
  tokenizer_model: artifacts/tokenizer/sion.model
  tokenizer_features: artifacts/tokenizer/token_features.npz
  dataset_dir: artifacts/dataset
  max_source_length: 512
  max_target_length: 512
  num_workers: 7

  # Character 5-gram MinHash grouping keeps near duplicates in one split.
  approximate_split: true

  # Physical pairs describe fields that can coexist in a source record. They do
  # not hard-code supported languages in Python. Another user can replace this
  # graph with any schema-valid language tags and compatible data.
  #
  # This repository's current snapshot contains mixed-input varieties (kj),
  # dialect varieties (kd and jd), and ko/ja/en parallel records.
  language_pairs:
    - [kj, ko]
    - [kj, ja]
    - [kd, ko]
    - [kd, ja]
    - [jd, ko]
    - [jd, ja]
    - [ko, ja]
    - [ko, en]
    - [en, ja]

  # These nodes may appear only as inputs. With the default bidirectional
  # policy, pairs involving a source-only node still create only edges away from
  # that node. This prevents mixed-language or dialect varieties from becoming
  # requested output languages.
  source_only_languages: [kj, kd, jd]

  # Keep release evidence separate from ordinary validation/test so synthetic
  # source-only rows can measure only relative T1-to-T2 refinement gains. Exact
  # basenames make the opt-in reviewable; future synthetic files remain train-only.
  # A 0.5% hash window left only 20 accepted examples on the sparsest edge
  # after endpoint-leakage and deduplication conflicts. A 2% window preserves a
  # practical margin for the fail-closed 32-distinct-row release cohort without
  # naming or special-casing any language in preprocessing code.
  refinement_evidence_fraction: 0.02
  source_only_synthetic_evidence_files:
    - synthetic_dialect_ja.jsonl
    - synthetic_dialect_ko.jsonl
    - synthetic_hanboneo.jsonl

  # Corpus-wide deduplication (2026-08-28) removed a different share of each
  # edge -- ko-en 6.05%, ko-ja 4.53%, en-ja 4.09% -- so the row counts no longer
  # balance: ko-ja 9,882,248 / en-ja 9,204,513 / ko-en 8,929,306, a 10.7% spread.
  # Sampling every configured pair equally recovers the balance from the data
  # itself instead of from a million newly acquired rows, and it re-derives on
  # its own whenever the corpus changes. max_source_upsampling still caps any
  # one source at three times its natural share, which is what keeps a tiny edge
  # such as kj-ko (10,731 pairs) from taking over the batch.
  language_pair_sampling_alpha: 0.0

  # Dialect region is row metadata, not a target control tag. Generating one
  # named regional dialect would require a separate reviewed tag design.
  #
  # Relevant corpus builders:
  #   scripts/data/build_hanboneo.py
  #   scripts/data/build_dialect_corpus.py
  #   scripts/data/build_netspeak_corpus.py
  #   scripts/data/build_formulaic_corpus.py

# Optional data overrides:
#   source_token_dropout: 0.05  # Online source dropout; zero disables it.
#   decoder_input_noise: 0.0    # Start near 0.1 only in a controlled ablation.
#   synthetic_prefix: bt_       # Train-only and automatically down-weighted.
#   glossary: glossary.json     # Enforce reviewed term mappings.
#   revision_examples: true     # For reviewed revision rows without revise_ names.
#   source_sampling_alpha: 0.90
#   source_sampling_weights:
#     noisy_source.jsonl: 0.40
#   num_workers: 8              # Otherwise derived from assigned CPU/GPU resources.
#   dataloader_timeout_seconds: 300  # Abort instead of billing forever on a stuck worker.

foundation:
  # Optional reasoning JSONL rows use prompt-to-delimited-trace supervision.
  # Long traces carry substantial decoder-token mass, so cap them at 5% of rows.
  reasoning_sample_share: 0.05

  # Foundation languages are configuration data, not a fixed code-level list.
  # All currently supported standard languages have monolingual reconstruction
  # data. Source-only varieties remain translation inputs rather than foundation
  # target languages.
  languages: [ko, ja, en]

  # Bound each language's monolingual tokenizer exposure relative to its
  # accepted parallel count. The tokenizer then applies its deterministic
  # graph-balanced global cap. This prevents the largest corpus from dominating
  # vocabulary while retaining meaningful monolingual coverage.
  #
  # SentencePiece 0.2.1 is pinned because the documented 0.2.2 multi-threaded
  # normalization regression caused a native crash. See
  # docs/sentencepiece-sigsegv.md for the reproduced evidence and policy.
  tokenizer_sample_ratio: 0.40
  batch_size_per_gpu: 32
  gradient_accumulation_steps: 1

training:
  # New identity avoids resuming an incompatible older automatic batch plan.
  output_dir: runs/modal-80gb
  precision: bf16
  compile: false
  batch_size_per_gpu: 32
  gradient_accumulation_steps: 8
  save_every_seconds: 900

  # Publish candidate-refinement weights only when the deployed raw or EMA
  # family improves every configured direction by this held-out token-NLL margin.
  candidate_refinement_min_worst_direction_nll_gain: 0.00001
  # Use distinct held-out rows. Repeating one scarce row cannot create release evidence.
  candidate_refinement_min_validation_examples_per_direction: 32

# Optional training overrides:
#   learning_rate: 0.0003
#   batch_size_per_gpu: 16          # Lower first after an SFT OOM.
#   num_train_epochs: 3             # Complete corpus passes.
#   ema_decay: 0.999                # Zero disables EMA.
#   save_every_seconds: 900         # Resume save at next completed update; 0 disables.
#   early_stopping_min_epochs: 2
#   early_stopping_patience: 5
#   precision: bf16                 # fp32 / bf16 / fp16
#   parallel_strategy: auto         # single / ddp / fsdp2 selected safely.
#   fsdp_reduce_dtype: bf16         # auto / bf16 / fp32
#   reshard_after_forward: false    # Faster only when measured VRAM allows it.
#   final_export_formats: [fp32, fp16, bf16, int8, int4, gguf_q4_k_m, transformers]

# Run composite MRT and candidate-preference training after translation SFT.
# The SFT comparison artifact is under runs/modal-80gb/pretrain; the final
# refined deployment artifact is under runs/modal-80gb/posttrain.
posttraining:
  enabled: true
  method: mrt
  num_train_epochs: 2
  # Explicit update budget takes precedence over the epoch count.
  max_steps: 100000

  # Long-row stress passed at source batch 8; source batch 16 ran out of memory.
  # Preserve effective batch 16 while increasing GPU work per microbatch.
  batch_size_per_gpu: 8
  gradient_accumulation_steps: 2
  learning_rate: 0.00003
  warmup_steps: 200
  samples_per_source: 4
  candidate_micro_batch: 4
  candidate_gradient_checkpointing: true
  sampling_temperature: 1.0
  top_k: 64
  max_new_tokens: 256
  risk_weight: 0.20
  mrt_alpha: 1.0
  preference_weight: 0.10
  preference_min_gap: 0.05
  preference_temperature: 1.0

  # Composite rewards reduce optimization toward one incomplete metric.
  reward_chrf_weight: 0.55
  reward_token_f1_weight: 0.15
  reward_number_weight: 0.10
  reward_structured_weight: 0.05
  reward_slot_weight: 0.05
  reward_language_weight: 0.05
  reward_length_weight: 0.05
  reward_repetition_penalty: 0.15
  reward_copy_penalty: 0.10

  # Subtract a fixed penalty per corrupted value. A proportional number score
  # alone can let an invented value win through a small chrF improvement.
  reward_number_corruption_penalty: 0.35

  # Use cycle consistency only when the required reverse edge is authenticated.
  roundtrip_enabled: true
  roundtrip_reward_weight: 0.20
  roundtrip_failure_penalty: 0.15
  roundtrip_min_score: 0.55
  roundtrip_num_beams: 1
  roundtrip_max_new_tokens: 256

  validation_num_beams: 4
  eval_batch_size_per_gpu: 1
  eval_every: 250
  save_every: 1000
  early_stopping_min_epochs: 2
  early_stopping_patience: 5
