# ============================================================================
# sion_translate 설정 파일
#
# `sion-train` 을 인자 없이 실행하면 이 파일을 자동으로 읽습니다.
# 여기 적지 않은 항목은 실행 환경(GPU/VRAM/CPU)과 데이터 규모를 보고
# 자동으로 결정됩니다. 즉, "바꾸고 싶은 것만" 주석을 풀어 적으면 됩니다.
#
# 자동으로 결정되는 것들:
#   - 모델 크기 (번역쌍 수 기준: ~60M / ~120M / ~200M / ~450M 파라미터)
#   - 정밀도 (bf16 지원 GPU → bf16, 아니면 fp16, CPU → fp32)
#   - GPU당 배치 크기와 activation checkpointing (VRAM 기준),
#     gradient accumulation (effective 256 목표)
#   - max_steps (corpus 약 4회 통과 예산, early stopping 으로 조기 종료)
#   - warmup / eval_every / save_every / eval_batches (step 예산에 비례)
#   - DataLoader worker 수, DDP/FSDP2 (다중 GPU 시)
#   - torch.compile은 GPU/컨테이너별 검증 뒤 training.compile로 명시적으로 활성화
#
# 데이터 자동 인식:
#   - data/ 폴더의 *.jsonl 을 스캔합니다. 파일을 추가하거나 내용이 바뀌면
#     다음 실행 때 자동으로 감지해 데이터셋을 다시 준비하고, step 수 등도
#     새 데이터 규모에 맞게 다시 계산됩니다.
#   - 토크나이저가 없으면 자동으로 학습합니다 (vocab 크기도 데이터 규모 기준).
#   - 이전 학습이 있으면 checkpoints/latest 에서 자동으로 이어서 학습합니다.
# ============================================================================

model:
  experimental:
    # ── 이번 ablation에서 끈 것 ─────────────────────────────────────────
    # Kimi K3 SiTU-GLU: FFN activation 폭주를 부드럽게 제한합니다.
    # state shape는 같아도 activation과 최적화 경로가 바뀌므로 CoRe와 동시에
    # 켜지 않고 별도 실험에서 검증합니다.
    situglu_enabled: false

    # BATS: 내장 collator에는 supervised alignment label 공급자가 없습니다.
    # coverage-only 목적은 uniform alignment에서도 0이 될 수 있으므로 기본 run에서
    # 학습 신호라고 간주하지 않습니다. 정렬 label을 연결한 별도 실험에서 켭니다.
    bats_enabled: false
    bats_coverage_weight: 0.0

    # ── 이번 ablation에서 켠 것 ─────────────────────────────────────────
    # CoRe: 목표문의 경어체를 분류하는 보조 loss 입니다. 코퍼스 실측에서
    # 한국어 반말이 존댓말의 2.1배(41.28% 대 19.45%)이고, "존댓말을 요청했는데
    # 반말이 섞이는" 실패가 여기서 옵니다. register_classes 4 는 prepare 의
    # infer_register ID 범위와 맞습니다. 다만 suffix 규칙에 걸리지 않는 class 0은
    # 미상으로 loss에서 제외되므로, 알려진 1~3 class에 대한 ablation입니다.
    # 안전 장치: ContentRegisterState 의 inject_gate 가 0 에서 시작하므로
    # step 0 에서는 forward 에 아무 영향이 없고 보조 loss 만 흐릅니다.
    # 즉 모델이 이 신호를 쓸지 말지를 학습으로 정합니다.
    core_enabled: true
    register_loss_weight: 0.05

    # ── 끈 것 ────────────────────────────────────────────────────────────
    # MorphoScript(문자체계 임베딩 융합): 끕니다. 문자체계 정보는 이미
    # token_features.npz 로 토크나이저에서 나오고, 무엇보다 **지금 실패하지
    # 않는 문제**입니다 — 방언·구어·정형 shard 전부 보존 검사에서 script
    # 위반 0 건이었습니다. 인코더 16층 중 4층마다 융합하는 비용을 지금 낼
    # 이유가 없습니다. script 실패가 실제로 관측되면 그때 켜십시오.
    morphoscript_enabled: false

    # TETM(typed entity memory): 끕니다. 아래 "한 번에 하나씩" 원칙에 따라
    # 이번 run 에서 검증할 모듈을 CoRe 하나로 좁힙니다.
    tetm_enabled: false

    # 첨부 설계를 검증하기 위한 1차 ablation 구현입니다. evidence_repair 는
    # decoder 뒤에서 encoder를 한 번 더 읽고, 수정 전 오류·수정 이득·요청 상한으로
    # gate를 학습합니다. 아직 입력 일부만 재인코딩하거나 출력 구간을 반복 수정하는
    # 완전한 폐루프는 아니므로 기본 run에서는 끕니다.
    evidence_repair_enabled: false
    # 원문 pooled state와 teacher-forced decoder state를 맞추는 학습용 대조 목적입니다.
    # 생성 결과를 독립적으로 다시 인코딩하는 checksum은 아니므로 별도 A/B 후 켭니다.
    semantic_parity_enabled: false

# 실험 모듈은 한 번에 하나씩만 켜서 baseline 과 비교하십시오. 여러 개를 동시에
# 켜면 좋아지거나 나빠졌을 때 무엇 때문인지 알 수 없습니다. 위 조합은
# 이번 재학습에서 실제 동작을 바꾸는 것은 CoRe 하나뿐입니다.

# 아래 모델 크기는 직접 고정하고 싶을 때만 주석 해제 (기본: 데이터 규모로 자동)
#   d_model: 768
#   encoder_layers: 16
#   decoder_layers: 8
#   num_heads: 12
#   num_kv_heads: 4
#   d_ff: 2048
#   dropout: 0.10
#   label_smoothing: 0.10
#   experimental:            # 위 model.experimental 이 실제 설정입니다

data:
  raw_dir: data              # 원천 JSONL 폴더 (여기에 파일을 추가하면 자동 인식)
  # 아래 세 산출물은 하나의 호환 단위입니다. 재사용 전 숫자 분리 정책, 언어 태그,
  # tokenizer SHA-256, index schema와 원천 데이터 지문을 검사합니다.
  tokenizer_model: artifacts/tokenizer/sion.model
  tokenizer_features: artifacts/tokenizer/token_features.npz
  dataset_dir: artifacts/dataset
  approximate_split: true    # 문자 5-gram MinHash로 근사 중복의 split 누수 방지

  # JSONL 키 이름이 곧 언어 이름입니다. 여기를 바꾸면 토크나이저의 <2xx>/
  # <denoise_xx> 제어 토큰, 전처리, 방향 태그가 전부 따라갑니다.
  #
  # 한 쌍만 쓸 때는 language_pairs 대신 language_pair: [en, de] 형식을 씁니다.
  #
  # data/ 에 한본어(kj)와 지역 방언(kd, jd) shard 가 있으므로 아래 7쌍을
  # 씁니다. 이 목록에서 어떤 쌍을 빼면 그 shard 는 학습되지 않습니다.
  language_pairs:
    - [kj, ko]
    - [kj, ja]
    - [kd, ko]
    - [kd, ja]
    - [jd, ko]
    - [jd, ja]
    - [ko, ja]

  # 입력으로만 받을 언어입니다. **이 줄을 빼면 안 됩니다.**
  #
  # kj 는 한국어와 일본어가 섞인 입력이고 번역 결과는 항상 한쪽 단일어여야
  # 합니다. kd/jd 는 지역 방언 입력이고, 목표는 방언을 *이해*하는 것이지
  # 표준 입력에 사투리로 답하는 것이 아닙니다.
  #
  # 등재하면 kj->ko, kd->ja 같은 이해 방향만 학습되고 역방향은 만들어지지
  # 않습니다. 등재하지 않으면 bidirectional 학습이 혼용문과 방언을 target
  # 으로도 배워서, 표준 한국어를 요청했는데 가나가 섞이거나 사투리가 나오는
  # 모델이 됩니다.
  source_only_languages: [kj, kd, jd]

  # 방언 shard 는 지역을 태그가 아니라 행 메타데이터(dialect_region)로 담습니다.
  # 특정 지역 방언으로 *생성*하게 하려면 별도 태그 스킴이 필요하고 아직 없습니다.
  #
  # 코퍼스 생성기: scripts/data/build_hanboneo.py,
  # scripts/data/build_dialect_corpus.py, scripts/data/build_netspeak_corpus.py,
  # scripts/data/build_formulaic_corpus.py
#   source_token_dropout: 0.05  # 온라인 증강(원문 토큰 탈락) 확률. 0 이면 끔
#   decoder_input_noise: 0.0    # 디코더 입력 교란(exposure bias 완화). 기본 0.
#                               # 측정 없이 켜지 마십시오 — 0.1 부터 A/B
#   synthetic_prefix: bt_    # 역번역 합성 파일 접두사 (train 전용 + 자동 다운웨이트)
#   glossary: glossary.json  # 용어집 JSON. 지정 시 번역/평가에서 용어 강제
#                            # 형식: [{"ko": "인공지능", "ja": "人工知能"}, ...]
#   revision_examples: true  # revise_ 외 이름으로 <draft> revision 예제를 넣었을 때
#   # 데이터가 특정 출처에 치우쳤을 때 샘플링 온도/가중치 조정
#   source_sampling_alpha: 0.90
#   source_sampling_weights:
#     noisy_source.jsonl: 0.40
#   num_workers: 8           # 기본은 실제 할당 CPU/GPU 수에 맞춰 자동 결정

training:
  output_dir: runs/auto      # 체크포인트/로그 저장 위치
#   learning_rate: 0.0003
#   batch_size_per_gpu: 16   # OOM 이 나면 이 값을 낮추세요
#   max_steps: 120000
#   ema_decay: 0.999         # 가중치 지수이동평균 (0 이면 끔; 기본 0.999 권장)
#   early_stopping_patience: 5
#   precision: bf16          # fp32 / bf16 / fp16
#   parallel_strategy: auto  # auto / ddp / fsdp2. H100에 모델이 들어가면 DDP 우선
#   fsdp_reduce_dtype: bf16   # FSDP2 통신 dtype: auto / bf16 / fp32
#   reshard_after_forward: false  # FSDP2에서 VRAM 여유 시 false가 더 빠름
#   # 전체 학습 뒤 best에서 한 번 생성(기본값이 아래 7종 전부)
#   final_export_formats: [fp32, fp16, bf16, int8, int4, gguf_q4_k_m, transformers]

# SFT 뒤 복합 보상 MRT + 다중 후보 선호학습을 자동 실행합니다.
# 두 단계 모델은 runs/auto/pretrain 과 runs/auto/posttrain 에 각각 저장됩니다.
posttraining:
  enabled: true
  method: mrt
  max_steps: 5000
  # 후보 생성은 SFT보다 메모리 변동폭이 큽니다. micro-batch 1로 모든 VRAM
  # 등급에서 안전 여유를 두고 accumulation으로 기존 effective batch를 유지합니다.
  batch_size_per_gpu: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.00003
  warmup_steps: 200
  samples_per_source: 4
  candidate_micro_batch: 1
  candidate_gradient_checkpointing: true
  sampling_temperature: 1.0
  top_k: 64
  max_new_tokens: 256
  risk_weight: 0.20
  mrt_alpha: 1.0
  preference_weight: 0.10
  preference_min_gap: 0.05
  preference_temperature: 1.0
  # chrF만 최적화할 때 생기는 metric 편향을 줄이는 보상 구성
  reward_chrf_weight: 0.55
  reward_token_f1_weight: 0.15
  reward_number_weight: 0.10
  reward_structured_weight: 0.05
  reward_slot_weight: 0.05
  reward_language_weight: 0.05
  reward_length_weight: 0.05
  reward_repetition_penalty: 0.15
  reward_copy_penalty: 0.10
  # 정방향 후보를 다시 원문 언어로 번역해 원문 복원에 실패하면 감점
  roundtrip_enabled: true
  roundtrip_reward_weight: 0.20
  roundtrip_failure_penalty: 0.15
  roundtrip_min_score: 0.55
  roundtrip_num_beams: 1
  roundtrip_max_new_tokens: 256
  validation_num_beams: 4
  eval_batch_size_per_gpu: 1
  eval_every: 250
  save_every: 1000
  early_stopping_patience: 5
