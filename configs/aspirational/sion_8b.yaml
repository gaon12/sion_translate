# Capacity-gate baseline: at least 4×80GB H100 with FP32 AdamW state and EMA.
model:
  d_model: 3072
  encoder_layers: 30
  decoder_layers: 30
  num_heads: 24
  num_kv_heads: 4
  d_ff: 11008
  max_seq_len: 4096
  dropout: 0.1
  gradient_checkpointing: true
  experimental:
    situglu_enabled: false
    bats_enabled: false
    bats_dim: 384
    bats_loss_weight: 0.0
    bats_coverage_weight: 0.0
    bats_stride: 4
    bats_max_positions: 1024
    core_enabled: false
    register_loss_weight: 0.0
    tetm_enabled: false
    morphoscript_enabled: false
    morphoscript_interval: 4
    candidate_refinement_enabled: true
    candidate_refinement_steps: 1
    candidate_refinement_temperature: 1.0
    candidate_refinement_loss_weight: 0.25
    candidate_refinement_vocab_chunk_size: 1024

data:
  tokenizer_model: artifacts/tokenizer/sion.model
  tokenizer_features: artifacts/tokenizer/token_features.npz
  dataset_dir: artifacts/dataset
  language_pairs:
    - [kj, ko]
    - [kj, ja]
    - [kd, ko]
    - [kd, ja]
    - [jd, ko]
    - [jd, ja]
    - [ko, ja]
    - [ko, en]
    - [en, ja]
  source_only_languages: [kj, kd, jd]
  refinement_evidence_fraction: 0.02
  source_only_synthetic_evidence_files:
    - synthetic_dialect_ja.jsonl
    - synthetic_dialect_ko.jsonl
    - synthetic_hanboneo.jsonl
  max_source_length: 512
  max_target_length: 512
  denoise_probability: 0.10
  validation_denoise_probability: 0.0
  num_workers: 8
  bucket_size: 8192
  source_sampling_alpha: 0.9
  max_source_upsampling: 3.0

training:
  output_dir: runs/sion-8b
  num_train_epochs: 2
  batch_size_per_gpu: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.00018
  warmup_steps: 2000
  precision: bf16
  compile: false
  parallel_strategy: fsdp2
  fsdp_reduce_dtype: bf16
  log_every: 10
  eval_every: 1000
  eval_batches: 50
  save_every: 1000
  early_stopping_min_epochs: 2
  early_stopping_patience: 8
  early_stopping_min_delta: 0.001
  # Publish candidate-refinement weights only when the deployed raw or EMA
  # family improves every configured direction by this held-out token-NLL margin.
  candidate_refinement_min_worst_direction_nll_gain: 0.00001
  # Use distinct held-out rows. Repeating one scarce row cannot create release evidence.
  candidate_refinement_min_validation_examples_per_direction: 32
  tensorboard: true
