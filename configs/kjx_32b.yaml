model:
  d_model: 5120
  encoder_layers: 42
  decoder_layers: 42
  num_heads: 40
  num_kv_heads: 8
  d_ff: 18432
  max_seq_len: 8192
  dropout: 0.1
  rms_norm_eps: 0.000001
  qk_norm: true
  gradient_checkpointing: true
  init_std: 0.0125
  experimental:
    bats_enabled: true
    bats_dim: 512
    bats_loss_weight: 0.0
    bats_coverage_weight: 0.0
    bats_stride: 8
    bats_max_positions: 1024
    core_enabled: true
    register_classes: 4
    register_loss_weight: 0.05
    tetm_enabled: true
    tetm_types: 10
    tetm_modes: 5
    morphoscript_enabled: true
    morphoscript_interval: 4
    script_classes: 9

data:
  tokenizer_model: artifacts/tokenizer/kjx.model
  tokenizer_features: artifacts/tokenizer/token_features.npz
  dataset_dir: artifacts/dataset
  max_source_length: 512
  max_target_length: 512
  denoise_probability: 0.10
  validation_denoise_probability: 0.0
  denoise_noise_density: 0.15
  denoise_mean_span: 3.0
  num_workers: 8
  bucket_size: 16384
  source_sampling_alpha: 0.9
  max_source_upsampling: 3.0

training:
  output_dir: runs/kjx-32b
  max_steps: 400000
  batch_size_per_gpu: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.00015
  min_learning_rate_ratio: 0.1
  warmup_steps: 6000
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  grad_clip: 1.0
  precision: bf16
  compile: false
  fsdp2: true
  reshard_after_forward: true
  log_every: 10
  eval_every: 1000
  eval_batches: 50
  save_every: 1000
  early_stopping_patience: 8
  early_stopping_min_delta: 0.001
  tensorboard: true
