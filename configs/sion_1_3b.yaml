model:
  d_model: 1536
  encoder_layers: 20
  decoder_layers: 20
  num_heads: 12
  num_kv_heads: 4
  d_ff: 4096
  max_seq_len: 2048
  dropout: 0.1
  gradient_checkpointing: true
  experimental:
    bats_enabled: true
    bats_dim: 256
    bats_loss_weight: 0.0
    bats_coverage_weight: 0.0
    bats_stride: 2
    bats_max_positions: 1024
    core_enabled: true
    register_loss_weight: 0.05
    tetm_enabled: true
    morphoscript_enabled: true
    morphoscript_interval: 4

data:
  tokenizer_model: artifacts/tokenizer/sion.model
  tokenizer_features: artifacts/tokenizer/token_features.npz
  dataset_dir: artifacts/dataset
  max_source_length: 512
  max_target_length: 512
  denoise_probability: 0.10
  validation_denoise_probability: 0.0
  num_workers: 8
  bucket_size: 8192
  source_sampling_alpha: 0.9
  max_source_upsampling: 3.0

training:
  output_dir: runs/sion-1.3b
  max_steps: 40000
  batch_size_per_gpu: 8
  gradient_accumulation_steps: 2
  learning_rate: 0.0002
  warmup_steps: 800
  precision: bf16
  compile: false
  parallel_strategy: fsdp2
  fsdp_reduce_dtype: bf16
  log_every: 10
  eval_every: 1000
  eval_batches: 50
  save_every: 1000
  early_stopping_patience: 8
  early_stopping_min_delta: 0.001
  tensorboard: true
