# 인코더 중심 배분. 파라미터 수는 20/20 구성과 정확히 같은 1,206,346,752 이지만
# decoder 층이 20 → 12 로 줄어듭니다. 자기회귀 디코딩은 이 모델에서 가중치 대역폭
# 바운드이고(KV cache 는 전체 바이트의 1.5%) decoder 층 수가 곧 토큰당 지연이므로,
# 같은 용량을 encoder 쪽에 두는 편이 품질·지연 양쪽에 유리합니다.
model:
  d_model: 1536
  encoder_layers: 30
  decoder_layers: 12
  num_heads: 12
  num_kv_heads: 4
  d_ff: 4096
  max_seq_len: 2048
  dropout: 0.1
  # A 1.3B model with BF16 activations and FP32 Adam states fits on an 80GB
  # H100 at this sequence/batch budget; recomputation only lowers utilization.
  gradient_checkpointing: false
  experimental:
    situglu_enabled: false
    bats_enabled: false
    bats_dim: 256
    bats_loss_weight: 0.0
    bats_coverage_weight: 0.0
    bats_stride: 2
    bats_max_positions: 1024
    core_enabled: false
    register_loss_weight: 0.0
    tetm_enabled: false
    morphoscript_enabled: false
    morphoscript_interval: 4

data:
  tokenizer_model: artifacts/tokenizer/sion.model
  tokenizer_features: artifacts/tokenizer/token_features.npz
  dataset_dir: artifacts/dataset
  language_pairs:
    - [kj, ko]
    - [kj, ja]
    - [kd, ko]
    - [kd, ja]
    - [jd, ko]
    - [jd, ja]
    - [ko, ja]
  source_only_languages: [kj, kd, jd]
  max_source_length: 512
  max_target_length: 512
  denoise_probability: 0.10
  validation_denoise_probability: 0.0
  num_workers: 8
  bucket_size: 8192
  source_sampling_alpha: 0.9
  max_source_upsampling: 3.0

training:
  output_dir: runs/sion-1.3b
  num_train_epochs: 3
  batch_size_per_gpu: 16
  gradient_accumulation_steps: 1
  learning_rate: 0.0002
  warmup_steps: 800
  precision: bf16
  compile: true
  parallel_strategy: ddp
  fsdp_reduce_dtype: bf16
  log_every: 10
  eval_every: 1000
  eval_batches: 50
  save_every: 1000
  early_stopping_min_epochs: 2
  early_stopping_patience: 8
  early_stopping_min_delta: 0.001
  tensorboard: true
