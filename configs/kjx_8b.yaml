model:
  d_model: 3072
  encoder_layers: 30
  decoder_layers: 30
  num_heads: 24
  num_kv_heads: 4
  d_ff: 11008
  max_seq_len: 4096
  dropout: 0.1
  gradient_checkpointing: true
  experimental:
    bats_enabled: true
    bats_dim: 384
    bats_loss_weight: 0.0
    bats_coverage_weight: 0.0
    bats_stride: 4
    bats_max_positions: 1024
    core_enabled: true
    register_loss_weight: 0.05
    tetm_enabled: true
    morphoscript_enabled: true
    morphoscript_interval: 4

data:
  tokenizer_model: artifacts/tokenizer/kjx.model
  tokenizer_features: artifacts/tokenizer/token_features.npz
  dataset_dir: artifacts/dataset
  max_source_length: 512
  max_target_length: 512
  denoise_probability: 0.10
  validation_denoise_probability: 0.0
  num_workers: 8
  bucket_size: 8192
  source_sampling_alpha: 0.9
  max_source_upsampling: 3.0

training:
  output_dir: runs/kjx-8b
  max_steps: 100000
  batch_size_per_gpu: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.00018
  warmup_steps: 2000
  precision: bf16
  compile: false
  fsdp2: true
  log_every: 10
  eval_every: 1000
  eval_batches: 50
  save_every: 1000
  early_stopping_patience: 8
  early_stopping_min_delta: 0.001
  tensorboard: true
