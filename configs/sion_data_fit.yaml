# Medium bilingual baseline. The 16-layer encoder / 8-layer decoder favors
# source understanding and faster autoregressive decoding.
model:
  d_model: 768
  encoder_layers: 16
  decoder_layers: 8
  num_heads: 12
  num_kv_heads: 4
  d_ff: 2048
  max_seq_len: 512
  dropout: 0.10
  rms_norm_eps: 0.000001
  qk_norm: true
  tie_embeddings: true
  label_smoothing: 0.10
  z_loss_weight: 0.0001
  gradient_checkpointing: false
  init_std: 0.02
  experimental:
    situglu_enabled: false
    bats_enabled: false
    core_enabled: false
    tetm_enabled: false
    morphoscript_enabled: false
    candidate_refinement_enabled: true
    candidate_refinement_steps: 1
    candidate_refinement_temperature: 1.0
    candidate_refinement_loss_weight: 0.25
    candidate_refinement_vocab_chunk_size: 2048

data:
  tokenizer_model: artifacts/tokenizer/sion.model
  tokenizer_features: artifacts/tokenizer/token_features.npz
  dataset_dir: artifacts/dataset
  language_pairs:
    - [kj, ko]
    - [kj, ja]
    - [kd, ko]
    - [kd, ja]
    - [jd, ko]
    - [jd, ja]
    - [ko, ja]
  source_only_languages: [kj, kd, jd]
  bidirectional: true
  max_source_length: 512
  max_target_length: 512
  denoise_probability: 0.10
  validation_denoise_probability: 0.0
  denoise_noise_density: 0.15
  denoise_mean_span: 3.0
  num_workers: 8
  bucket_size: 8192
  # Temperature sampling reduces domination by unusually large input files.
  source_sampling_alpha: 0.90
  max_source_upsampling: 3.0

training:
  output_dir: runs/sion-data-fit
  seed: 20260711
  # H100 80GB: use the headroom observed with batch 16. On 8 GPUs this remains
  # an effective batch of 256 sequences/update without an extra accumulation pass.
  num_train_epochs: 3
  batch_size_per_gpu: 32
  gradient_accumulation_steps: 1
  learning_rate: 0.0003
  min_learning_rate_ratio: 0.10
  warmup_steps: 3000
  weight_decay: 0.10
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 0.00000001
  grad_clip: 1.0
  precision: bf16
  compile: true
  parallel_strategy: ddp
  fsdp_reduce_dtype: bf16
  log_every: 20
  eval_every: 1000
  eval_batches: 200
  save_every: 5000
  early_stopping_min_epochs: 2
  early_stopping_patience: 8
  early_stopping_min_delta: 0.001
  tensorboard: true

posttraining:
  enabled: true
  method: mrt
  num_train_epochs: 2
  batch_size_per_gpu: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.00003
  warmup_steps: 200
  samples_per_source: 4
  candidate_micro_batch: 1
  candidate_gradient_checkpointing: true
  sampling_temperature: 1.0
  top_k: 64
  max_new_tokens: 256
  risk_weight: 0.20
  mrt_alpha: 1.0
  preference_weight: 0.10
  preference_min_gap: 0.05
  preference_temperature: 1.0
  reward_chrf_weight: 0.55
  reward_token_f1_weight: 0.15
  reward_number_weight: 0.10
  reward_structured_weight: 0.05
  reward_slot_weight: 0.05
  reward_language_weight: 0.05
  reward_length_weight: 0.05
  reward_repetition_penalty: 0.15
  reward_copy_penalty: 0.10
  roundtrip_enabled: true
  roundtrip_reward_weight: 0.20
  roundtrip_failure_penalty: 0.15
  roundtrip_min_score: 0.55
  roundtrip_num_beams: 1
  roundtrip_max_new_tokens: 256
  validation_num_beams: 4
  eval_batch_size_per_gpu: 1
  eval_every: 250
  save_every: 1000
  early_stopping_min_epochs: 2
  early_stopping_patience: 5
